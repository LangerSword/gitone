name: rook-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: rook-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: rook / automated review
    # Fork PRs get a read-only token on pull_request; comment and route only on
    # branches inside this repository. This check is informational, never a merge gate.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # PR metadata is untrusted; keep it in env vars and pass it to files,
      # never interpolate it into shell commands.
      HERMES_HOME: /tmp/hermes-home
      NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      ROOK_REVIEWER: ${{ vars.ROOK_REVIEWER || github.repository_owner }}
      ROOK_SECOND_REVIEWER: ${{ vars.ROOK_SECOND_REVIEWER }}

    steps:
      - name: Route review to the owner
        id: route
        # PR_AUTHOR is event data, but it is only compared with quoted repo
        # variables. It is never used to build a shell command or API path.
        run: |
          set -euo pipefail
          target="$ROOK_REVIEWER"
          if [ "$PR_AUTHOR" = "$target" ]; then
            target="${ROOK_SECOND_REVIEWER:-}"
          fi
          if [ -z "$target" ]; then
            echo "Rook skipped the review request: @$PR_AUTHOR authored this PR and no second reviewer is configured."
            echo "Rook skipped review routing: self-authored PR and no ROOK_SECOND_REVIEWER variable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PR_AUTHOR" = "$target" ]; then
            echo "Rook skipped the review request: GitHub does not allow a self-review request."
            echo "Rook skipped review routing: GitHub rejects a self-review request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$target"; then
            echo "Rook requested review from @$target."
            echo "Rook requested review from @$target." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Rook review routing::Could not request review from @$target."
            echo "Rook could not request review from @$target." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check reviewer credential
        id: credential
        run: |
          set -euo pipefail
          if [ -z "${NOUS_API_KEY:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Rook review skipped: set repository secret NOUS_API_KEY to enable it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Hermes Agent
        if: steps.credential.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version

      - name: Select a free Nous model
        id: model
        if: steps.credential.outputs.available == 'true'
        run: |
          set -euo pipefail
          model="$(python3 scripts/select_free_model.py)"
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Rook review model: $model" >> "$GITHUB_STEP_SUMMARY"

      - name: Build review prompt
        if: steps.credential.outputs.available == 'true'
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" --json title,body --jq '"TITLE: \(.title)\nBODY:\n\(.body // "")"' > pr-meta.txt
          gh pr diff "$PR_NUMBER" --repo "$REPO" > pr.diff
          python3 scripts/build_review_prompt.py

      - name: Run Rook review
        if: steps.credential.outputs.available == 'true'
        env:
          HERMES_MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          hermes chat --query-file prompt.txt --provider custom --base-url https://inference-api.nousresearch.com/v1 --api-key "$NOUS_API_KEY" --model "$HERMES_MODEL" --reasoning max --toolsets '' --safe-mode --ignore-rules --max-turns 1 --oneshot --quiet > review.md
          test -s review.md

      - name: Post review comment
        if: steps.credential.outputs.available == 'true'
        env:
          HERMES_MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          {
            echo "**Rook / automated review**"
            echo
            cat review.md
          } > review-post.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file review-post.md
          echo "Rook posted a non-blocking review using $HERMES_MODEL." >> "$GITHUB_STEP_SUMMARY"
