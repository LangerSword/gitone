# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Direct, concise, evidence-first. Flag concrete defects before style. No generic praise."
early_access: false
reviews:
  profile: chill
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/*.lock"
    - "!docs/**"
chat:
  auto_reply: true
