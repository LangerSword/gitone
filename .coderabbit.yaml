# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Follow docs/REVIEW_RULES.md. Use human, direct ASD-STE100 prose. Findings first, with path, line, evidence, and exact fix. No praise, emoji, or speculation."
early_access: false
reviews:
  profile: chill
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/*.lock"
    - "!docs/**"
chat:
  auto_reply: true
